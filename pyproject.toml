[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotrace"
version = "1.0.0"
authors = [
  { name="ZeroTrace Team" },
]
description = "Next-Gen All-in-One OSINT & Reconnaissance Framework"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "phonenumbers>=8.13.0",
    "dnspython>=2.6.0"
]

[project.scripts]
zerotrace = "zerotrace.cli:main"
